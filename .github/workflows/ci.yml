name: Car Cupid Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-check:
    name: Python Syntax and Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: python -m compileall -q car_cupid_service

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check car_cupid_service