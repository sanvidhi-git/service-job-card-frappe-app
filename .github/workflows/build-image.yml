
name: Build and Publish ERPNext Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Encode apps.json
        id: apps
        run: |
          echo "apps_json=$(base64 -w 0 apps.json)" >> "$GITHUB_OUTPUT"

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/custom-erpnext" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ERPNext Image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/rskshirsagar/erp-docker.git
          file: images/custom/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            PYTHON_VERSION=3.14.2
            NODE_VERSION=24.11.0
            APPS_JSON_BASE64=${{ steps.apps.outputs.apps_json }}
