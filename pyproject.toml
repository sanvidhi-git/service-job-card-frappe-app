[project]
name = "car_cupid_service"
authors = [
    { name = "Sanvidhi Tech Pvt Ltd", email = "vijayshastri11@gmail.com" }
]
description = "Car Cupid Service - multi-company service job card, store fulfilment and web POS for ERPNext v16"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
